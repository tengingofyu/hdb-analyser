name: Update Coordinates

on:
  schedule:
    - cron: '0 2 1 * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install node-fetch
        run: npm install node-fetch

      - name: Generate coordinates
        env:
          DATAGOV_API_KEY: ${{ secrets.DATAGOV_API_KEY }}
        run: |
          node --input-type=module << 'EOF'
          import fetch from 'node-fetch';
          import fs from 'fs';

          const sleep = ms => new Promise(r => setTimeout(r, ms));

          async function fetchDataset(id, limit=500, fields='') {
            const headers = process.env.DATAGOV_API_KEY ? {'x-api-key': process.env.DATAGOV_API_KEY} : {};
            let all = [], offset = 0;
            while (true) {
              const fieldsParam = fields ? '&fields=' + fields : '';
              const r = await fetch(`https://data.gov.sg/api/action/datastore_search?resource_id=${id}&limit=${limit}&offset=${offset}${fieldsParam}`, {headers});
              const d = await r.json();
              if (!d.result?.records) throw new Error('Dataset fetch failed: ' + id + ' response: ' + JSON.stringify(d).slice(0,200));
              all = all.concat(d.result.records);
              if (all.length >= d.result.total || d.result.records.length < limit) break;
              offset += limit;
              await sleep(300);
            }
            console.log(`Fetched ${all.length} records from ${id}`);
            return all;
          }

          async function geocodeAll(entries, label) {
            const postalMap = {};
            for (const e of entries) {
              const p = (e.postal||'').toString().padStart(6,'0');
              if (p && p !== '000000') { if (!postalMap[p]) postalMap[p]=[]; postalMap[p].push(e.name); }
            }
            const postals = Object.keys(postalMap);
            console.log(`Geocoding ${postals.length} postal codes for ${label}...`);
            const coords = {};
            let done = 0;
            for (const p of postals) {
              try {
                const r = await fetch(`https://www.onemap.gov.sg/api/common/elastic/search?searchVal=${p}&returnGeom=Y&getAddrDetails=Y&pageNum=1`);
                const d = await r.json();
                if (d.results?.length) coords[p] = [parseFloat(d.results[0].LATITUDE), parseFloat(d.results[0].LONGITUDE)];
              } catch(e) {}
              done++;
              if (done % 100 === 0) console.log(`  ${done}/${postals.length}...`);
              await sleep(150);
            }
            const result = [];
            for (const [p, names] of Object.entries(postalMap)) {
              if (coords[p]) {
                for (const n of names) {
                  result.push({n, lat: Math.round(coords[p][0]*100000)/100000, lng: Math.round(coords[p][1]*100000)/100000});
                }
              }
            }
            console.log(`${result.length} ${label} geocoded`);
            return result;
          }

          function buildConst(name, entries) {
            const items = entries.map(e => `  {n:'${e.n.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}',lat:${e.lat},lng:${e.lng}}`);
            return `const ${name}=[\n${items.join(',\n')}\n];`;
          }

          function inject(html, name, newConst) {
            const regex = new RegExp(`const ${name}=\\[\\n[\\s\\S]*?\\n\\];`, 'm');
            if (regex.test(html)) return html.replace(regex, newConst);
            throw new Error(`Cannot find ${name} in index.html`);
          }

          // Fetch primary schools
          const schoolRecs = await fetchDataset('d_688b934f82c1059ed0a6993d2a829089');
          const primaries = schoolRecs.filter(r=>r.mainlevel_code==='PRIMARY').map(r=>({name:r.school_name,postal:r.postal_code}));
          const schools = await geocodeAll(primaries, 'schools');

          // Fetch ECDA centres, split by service_model (CC/EYC/EYC-DS = childcare, KN = kindergarten, drop DS)
          const ecdaRecs = await fetchDataset('d_696c994c50745b079b3684f0e90ffc53');
          const ccEntries = ecdaRecs.filter(r=>['CC','EYC','EYC-DS'].includes(r.service_model)).map(r=>({name:r.centre_name||'',postal:r.postal_code})).filter(r=>r.name&&r.name!=='na'&&r.postal);
          const knEntries = ecdaRecs.filter(r=>r.service_model==='KN').map(r=>({name:r.centre_name||'',postal:r.postal_code})).filter(r=>r.name&&r.name!=='na'&&r.postal);
          const childcare = await geocodeAll(ccEntries, 'childcare');
          const ecdaKindergartens = await geocodeAll(knEntries, 'ECDA kindergartens');

          // Normalize MOE Kindergarten names from ECDA to consistent uppercase form
          for (const k of ecdaKindergartens) if (/^MOE KINDERGARTEN @ /i.test(k.n)) k.n = k.n.toUpperCase();

          // Fetch MOE Kindergartens — names from MOE locations page, coords from primary school list.
          // Skip any MK already present in ECDA KN (case-insensitive name match).
          const keyof = s => s.toUpperCase().replace(/[^A-Z0-9]/g,'');
          const ecdaKnKeys = new Set(ecdaKindergartens.map(k=>keyof(k.n)));
          const mkPage = await (await fetch('https://www.moe.gov.sg/preschool/moe-kindergarten/locations')).text();
          const mkNames = [...new Set([...mkPage.matchAll(/MOE Kindergarten @ ([A-Za-z][A-Za-z0-9 \-]{0,40})/g)].map(m=>m[1].trim()))].filter(s=>!/ceased|will open/i.test(s));
          const norm = s => s.toUpperCase().replace(/[^A-Z0-9 ]/g,'').trim();
          const priIdx = {};
          for (const s of schools) priIdx[norm(s.n)] = s;
          const moeMKs = [];
          let mkSkipped = 0;
          for (const mk of mkNames) {
            const fullName = `MOE KINDERGARTEN @ ${mk.toUpperCase()}`;
            if (ecdaKnKeys.has(keyof(fullName))) { mkSkipped++; continue; }
            const candidates = [norm(mk+' PRIMARY SCHOOL'), norm(mk+' SCHOOL'), norm(mk)];
            let hit = candidates.map(c=>priIdx[c]).find(Boolean);
            if (!hit) { const mn=norm(mk); for (const k in priIdx) if (mn===k.replace(' PRIMARY SCHOOL','')||k.includes(mn)) {hit=priIdx[k]; break;} }
            if (hit) moeMKs.push({n:fullName, lat:hit.lat, lng:hit.lng});
          }
          console.log(`MOE MKs: ${moeMKs.length} added (${mkSkipped} already in ECDA, ${mkNames.length-moeMKs.length-mkSkipped} unmatched)`);
          const kindergartens = [...ecdaKindergartens, ...moeMKs];

          // Update index.html
          function buildConstFromObjs(name, items) {
            const lines = items.map(e=>`  {n:'${e.n.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}',lat:${e.lat},lng:${e.lng}}`);
            return `const ${name}=[\n${lines.join(',\n')}\n];`;
          }
          let html = fs.readFileSync('index.html','utf8');
          html = inject(html, 'PRIMARY_SCHOOLS', buildConst('PRIMARY_SCHOOLS', schools));
          html = inject(html, 'CHILDCARE_CENTRES', buildConstFromObjs('CHILDCARE_CENTRES', childcare));
          html = inject(html, 'KINDERGARTENS', buildConstFromObjs('KINDERGARTENS', kindergartens));
          fs.writeFileSync('index.html', html);
          console.log(`index.html updated (${schools.length} primaries, ${childcare.length} childcare, ${kindergartens.length} kindergartens incl. ${moeMKs.length} MOE MK)`);
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "chore: update school and childcare coordinates [$(date '+%Y-%m-%d')]"
          git push
