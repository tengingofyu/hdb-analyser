name: Update Coordinates

on:
  schedule:
    - cron: '0 2 1 * *'
  workflow_dispatch:
  # Self-serve trigger via commit: touch .github/dispatch-coords (any content)
  # and push. The path filter isolates this from other main pushes so routine
  # commits don't fire the 15-min job.
  push:
    branches: [main]
    paths: ['.github/dispatch-coords']

# Self-overlap protection. Each run takes ~10–15 min and pushes to main;
# two concurrent runs would race each other's rebase-and-push. Queue the
# second one instead of cancelling — the geocode work isn't cheap to waste.
concurrency:
  group: update-coords
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install node-fetch
        run: npm install node-fetch

      - name: Generate coordinates
        env:
          DATAGOV_API_KEY: ${{ secrets.DATAGOV_API_KEY }}
        run: |
          node --input-type=module << 'EOF'
          import fetch from 'node-fetch';
          import fs from 'fs';

          const sleep = ms => new Promise(r => setTimeout(r, ms));

          // ── Parse existing constant so we can fall back to prior coords ─────────
          //    Emitted format is {n:'...'[,p:'postal'],lat:X,lng:Y} — the p field is
          //    new; legacy entries without p still parse and fall back by name.
          function parseExistingConstant(html, name) {
            const m = html.match(new RegExp('const ' + name + '=\\[\\n([\\s\\S]*?)\\n\\];', 'm'));
            if (!m) return [];
            return [...m[1].matchAll(/\{n:'([^']*)'(?:,p:'([^']*)')?,lat:([\d.]+),lng:([\d.]+)\}/g)]
              .map(e => ({n: e[1], p: e[2] || null, lat: +e[3], lng: +e[4]}));
          }

          async function fetchDataset(id, limit=500) {
            const headers = process.env.DATAGOV_API_KEY ? {'x-api-key': process.env.DATAGOV_API_KEY} : {};
            let all = [], offset = 0;
            while (true) {
              const r = await fetchWithTimeout(`https://data.gov.sg/api/action/datastore_search?resource_id=${id}&limit=${limit}&offset=${offset}`, {headers}, 15000);
              const d = await r.json();
              if (!d.result?.records) throw new Error('Dataset fetch failed: ' + id + ' response: ' + JSON.stringify(d).slice(0,200));
              all = all.concat(d.result.records);
              if (all.length >= d.result.total || d.result.records.length < limit) break;
              offset += limit;
              await sleep(300);
            }
            console.log(`Fetched ${all.length} records from ${id}`);
            return all;
          }

          // fetch() in Node has no default timeout — a connection OneMap opens but never
          // completes will hang the whole workflow. Wrap every network call in a hard
          // per-request cap so a stall fails fast into the retry loop instead.
          async function fetchWithTimeout(url, opts={}, timeoutMs=10000) {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), timeoutMs);
            try {
              return await fetch(url, { ...opts, signal: ctrl.signal });
            } finally {
              clearTimeout(timer);
            }
          }

          // Retry a single OneMap postal lookup with 1s/2s/4s backoff on any failure
          // (non-200, empty results, JSON error, network, timeout). Throws on final failure.
          async function geocodePostalOnce(p) {
            const delays = [1000, 2000, 4000];
            let lastErr = null;
            for (let attempt = 0; attempt < 4; attempt++) {
              try {
                const r = await fetchWithTimeout(`https://www.onemap.gov.sg/api/common/elastic/search?searchVal=${p}&returnGeom=Y&getAddrDetails=Y&pageNum=1`);
                if (!r.ok) { lastErr = 'HTTP ' + r.status; }
                else {
                  const d = await r.json();
                  if (d.results?.length) return [parseFloat(d.results[0].LATITUDE), parseFloat(d.results[0].LONGITUDE)];
                  lastErr = 'empty results';
                }
              } catch(e) {
                lastErr = e.name === 'AbortError' ? 'timeout after 10s' : e.message;
              }
              if (attempt < 3) await sleep(delays[attempt]);
            }
            throw new Error(lastErr || 'unknown');
          }

          async function geocodeAll(entries, label, previous) {
            // Index previous coords by postal (stable) and by name (fallback for
            // renames — MOE occasionally punctuates "St. Anthony's" differently
            // or merges schools; postal is what actually pins location).
            const prevByPostal = {}, prevByName = {};
            for (const e of previous) {
              if (e.p) prevByPostal[e.p] = e;
              if (e.n) prevByName[e.n] = e;
            }

            const postalMap = {}; // postal → [names] (multiple schools can share a postal in edge cases)
            for (const e of entries) {
              const p = (e.postal||'').toString().padStart(6,'0');
              if (p && p !== '000000') {
                if (!postalMap[p]) postalMap[p] = [];
                postalMap[p].push(e.name);
              }
            }
            const postals = Object.keys(postalMap);
            console.log(`Geocoding ${postals.length} postal codes for ${label}...`);

            const coords = {};
            const failed = [];
            let done = 0;
            // Bounded parallelism: 4 concurrent workers each pulling from a shared
            // queue. Each worker naturally paces itself at OneMap's response time
            // (~750ms per request unauth'd), yielding ~5 req/s aggregate — well
            // below what OneMap tolerates, but 4× the previous serial throughput.
            // First (serial) run took 30m53s for ~1700 postals; this should land
            // near 7-8 min for the same input.
            let cursor = 0;
            const CONCURRENCY = 4;
            async function worker() {
              while (cursor < postals.length) {
                const i = cursor++;
                const p = postals[i];
                try {
                  coords[p] = await geocodePostalOnce(p);
                } catch(e) {
                  failed.push({postal: p, reason: e.message});
                }
                done++;
                if (done % 100 === 0) console.log(`  ${done}/${postals.length} (${failed.length} still failed after retries)`);
              }
            }
            await Promise.all(Array.from({length: CONCURRENCY}, () => worker()));

            if (failed.length) {
              console.log(`  ${failed.length} postal(s) failed all 4 attempts:`);
              for (const f of failed.slice(0, 30)) console.log(`    ${f.postal}: ${f.reason}`);
              if (failed.length > 30) console.log(`    ... and ${failed.length - 30} more`);
            }

            // Compose. Fallback order per entry: fresh geocode → previous coord by
            // postal → previous coord by name → dropped ("lost").
            const emitted = [];
            let freshEmitted = 0, reusedByPostal = 0, reusedByName = 0, lost = 0;
            const emittedNames = new Set();
            for (const [p, names] of Object.entries(postalMap)) {
              for (const n of names) {
                if (coords[p]) {
                  emitted.push({n, p, lat: Math.round(coords[p][0]*100000)/100000, lng: Math.round(coords[p][1]*100000)/100000});
                  freshEmitted++;
                } else if (prevByPostal[p]) {
                  emitted.push({n, p, lat: prevByPostal[p].lat, lng: prevByPostal[p].lng});
                  reusedByPostal++;
                } else if (prevByName[n]) {
                  emitted.push({n, p, lat: prevByName[n].lat, lng: prevByName[n].lng});
                  reusedByName++;
                } else {
                  console.log(`  LOST: "${n}" (postal ${p}) — no fresh coord and no prior entry`);
                  lost++;
                }
                emittedNames.add(n);
              }
            }

            // Entries present in previous but not in the source dataset this run.
            const goneFromSource = previous.filter(e => e.n && !emittedNames.has(e.n)).length;

            console.log(`  ${label}: emitted ${emitted.length} — ${freshEmitted} fresh, ${reusedByPostal} reused-by-postal, ${reusedByName} reused-by-name, ${lost} lost, ${goneFromSource} gone-from-source`);
            return {entries: emitted, prevCount: previous.length, freshEmitted, reusedByPostal, reusedByName, lost, goneFromSource};
          }

          function esc(s) { return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/</g,'\\u003c'); }
          function buildConst(name, entries) {
            const items = entries.map(e => {
              const pPart = e.p ? `,p:'${esc(e.p)}'` : '';
              return `  {n:'${esc(e.n)}'${pPart},lat:${e.lat},lng:${e.lng}}`;
            });
            return `const ${name}=[\n${items.join(',\n')}\n];`;
          }
          function inject(html, name, newConst) {
            const regex = new RegExp('const ' + name + '=\\[\\n[\\s\\S]*?\\n\\];', 'm');
            if (regex.test(html)) return html.replace(regex, newConst);
            throw new Error(`Cannot find ${name} in index.html`);
          }

          // ── Property-info street canonicaliser ──────────────────────────────────
          //    HDB's "street" field uses ABBREVIATIONS (AVE, RD, JLN, ...) while
          //    OneMap's ROAD_NAME returns them SPELLED OUT (AVENUE, ROAD, JALAN, ...).
          //    Client-side lookup joins on the canonical form, so both sides must
          //    apply the same map. Kept intentionally small — every entry here has
          //    been sighted in real HDB street strings.
          const STREET_ABBREVIATIONS = [
            [/\bAVE\b/g,'AVENUE'],   [/\bBT\b/g,'BUKIT'],    [/\bCL\b/g,'CLOSE'],
            [/\bCRES\b/g,'CRESCENT'],[/\bCTRL\b/g,'CENTRAL'],[/\bDR\b/g,'DRIVE'],
            [/\bJLN\b/g,'JALAN'],    [/\bKG\b/g,'KAMPONG'],  [/\bLOR\b/g,'LORONG'],
            [/\bNTH\b/g,'NORTH'],    [/\bPK\b/g,'PARK'],     [/\bPL\b/g,'PLACE'],
            [/\bRD\b/g,'ROAD'],      [/\bST\b/g,'STREET'],   [/\bSTH\b/g,'SOUTH'],
            [/\bTER\b/g,'TERRACE'],  [/\bTG\b/g,'TANJONG'],  [/\bMKT\b/g,'MARKET'],
            [/\bC'WEALTH\b/g,'COMMONWEALTH'], [/\bUPP\b/g,'UPPER'],
          ];
          function canonStreet(s) {
            let out = (s||'').toUpperCase();
            for (const [re, w] of STREET_ABBREVIATIONS) out = out.replace(re, w);
            return out.replace(/\s+/g,' ').trim();
          }

          // Load existing PROPERTY_INFO as a fallback if the fetch fails or drifts.
          // Format in the file is: const PROPERTY_INFO={"STREET NAME":{"BLK":"mixStr",...},...};
          function parsePropertyInfo(html) {
            const m = html.match(/const PROPERTY_INFO=(\{[\s\S]*?\});/m);
            if (!m) return {};
            try { return JSON.parse(m[1]); }
            catch(e) { console.log('  WARN: failed to parse existing PROPERTY_INFO:', e.message); return {}; }
          }

          function buildPropertyInfo(records) {
            const fields = ['1room_sold','2room_sold','3room_sold','4room_sold','5room_sold','exec_sold','multigen_sold'];
            const codes  = ['1','2','3','4','5','e','g'];
            const byStreet = {};
            let counted = 0;
            for (const r of records) {
              if (r.residential !== 'Y') continue;
              if (+(r.total_dwelling_units||'0') <= 0) continue;
              const parts = [];
              for (let i = 0; i < fields.length; i++) {
                const n = +(r[fields[i]] || '0');
                if (n > 0) parts.push(`${codes[i]}:${n}`);
              }
              if (!parts.length) continue;
              const street = canonStreet(r.street);
              const blk = (r.blk_no||'').toUpperCase();
              if (!street || !blk) continue;
              (byStreet[street] ||= {})[blk] = parts.join(',');
              counted++;
            }
            return { byStreet, counted };
          }

          function buildPropertyInfoConst(byStreet) {
            const lines = [];
            for (const s of Object.keys(byStreet).sort()) {
              lines.push(`${JSON.stringify(s)}:${JSON.stringify(byStreet[s])}`);
            }
            return `const PROPERTY_INFO={\n${lines.join(',\n')}\n};`;
          }

          // ── Main ────────────────────────────────────────────────────────────────
          let html = fs.readFileSync('index.html','utf8');
          const prevSchools       = parseExistingConstant(html, 'PRIMARY_SCHOOLS');
          const prevChildcare     = parseExistingConstant(html, 'CHILDCARE_CENTRES');
          const prevKindergartens = parseExistingConstant(html, 'KINDERGARTENS');
          const prevPropertyInfo  = parsePropertyInfo(html);
          const prevPropertyCount = Object.values(prevPropertyInfo).reduce((a,o) => a + Object.keys(o).length, 0);
          console.log(`Existing constants: schools=${prevSchools.length}, childcare=${prevChildcare.length}, kindergartens=${prevKindergartens.length}, property-info=${prevPropertyCount}`);

          // Primary schools
          const schoolRecs = await fetchDataset('d_688b934f82c1059ed0a6993d2a829089');
          // Include MIXED LEVEL (P1-S4) — integrated primary+secondary institutions (Catholic High,
          // CHIJ St. Nicholas Girls', Maris Stella High) teach primary levels but are tagged with the
          // MIXED LEVEL code, and were being silently dropped when we filtered on PRIMARY alone.
          const primaries = schoolRecs.filter(r=>r.mainlevel_code==='PRIMARY'||r.mainlevel_code==='MIXED LEVEL (P1-S4)').map(r=>({name:r.school_name,postal:r.postal_code}));
          const schoolsR = await geocodeAll(primaries, 'schools', prevSchools);

          // ECDA centres
          const ecdaRecs = await fetchDataset('d_696c994c50745b079b3684f0e90ffc53');
          const ccEntries = ecdaRecs.filter(r=>['CC','EYC','EYC-DS'].includes(r.service_model)).map(r=>({name:r.centre_name||'',postal:r.postal_code})).filter(r=>r.name&&r.name!=='na'&&r.postal);
          const knEntries = ecdaRecs.filter(r=>r.service_model==='KN').map(r=>({name:r.centre_name||'',postal:r.postal_code})).filter(r=>r.name&&r.name!=='na'&&r.postal);
          const childcareR = await geocodeAll(ccEntries, 'childcare', prevChildcare);
          // Split prev kindergartens: ECDA KN portion (previous had postals) vs MOE MK
          // portion (previous coords sourced from schools, no postal). The ECDA leg
          // uses postal fallback; MOE MKs are re-derived from primary school coords
          // downstream so previous MK data doesn't need to be threaded through here.
          const prevEcdaKn = prevKindergartens.filter(e => !/^MOE KINDERGARTEN @ /i.test(e.n));
          const ecdaKindergartensR = await geocodeAll(knEntries, 'ECDA kindergartens', prevEcdaKn);
          const ecdaKindergartens = ecdaKindergartensR.entries;

          // Normalize MOE Kindergarten names from ECDA to consistent uppercase form
          for (const k of ecdaKindergartens) if (/^MOE KINDERGARTEN @ /i.test(k.n)) k.n = k.n.toUpperCase();

          // Fetch MOE Kindergartens — names from MOE locations page, coords from primary school list.
          // Skip any MK already present in ECDA KN (case-insensitive name match).
          const keyof = s => s.toUpperCase().replace(/[^A-Z0-9]/g,'');
          const ecdaKnKeys = new Set(ecdaKindergartens.map(k=>keyof(k.n)));
          const mkPage = await (await fetchWithTimeout('https://www.moe.gov.sg/preschool/moe-kindergarten/locations', {}, 15000)).text();
          const mkNames = [...new Set([...mkPage.matchAll(/MOE Kindergarten @ ([A-Za-z][A-Za-z0-9 \-]{0,40})/g)].map(m=>m[1].trim()))].filter(s=>!/ceased|will open/i.test(s));
          const norm = s => s.toUpperCase().replace(/[^A-Z0-9 ]/g,'').trim();
          const priIdx = {};
          for (const s of schoolsR.entries) priIdx[norm(s.n)] = s;
          const moeMKs = [];
          let mkSkipped = 0;
          for (const mk of mkNames) {
            const fullName = `MOE KINDERGARTEN @ ${mk.toUpperCase()}`;
            if (ecdaKnKeys.has(keyof(fullName))) { mkSkipped++; continue; }
            const candidates = [norm(mk+' PRIMARY SCHOOL'), norm(mk+' SCHOOL'), norm(mk)];
            let hit = candidates.map(c=>priIdx[c]).find(Boolean);
            if (!hit) { const mn=norm(mk); for (const k in priIdx) if (mn===k.replace(' PRIMARY SCHOOL','')||k.includes(mn)) {hit=priIdx[k]; break;} }
            if (hit) moeMKs.push({n:fullName, lat:hit.lat, lng:hit.lng});
          }
          console.log(`MOE MKs: ${moeMKs.length} added (${mkSkipped} already in ECDA, ${mkNames.length-moeMKs.length-mkSkipped} unmatched)`);
          const kindergartens = [...ecdaKindergartens, ...moeMKs];

          // Sanity gate: 95% floor per dataset. Skips when previous was zero (first
          // bootstrap after a truncated state). Aborts before write on drop >5%.
          function gate(name, newCount, oldCount) {
            if (oldCount > 0 && newCount < oldCount * 0.95) {
              throw new Error(`SANITY GATE FAILED: ${name} ${oldCount}→${newCount} (< 95% of previous)`);
            }
          }
          gate('PRIMARY_SCHOOLS', schoolsR.entries.length, prevSchools.length);
          gate('CHILDCARE_CENTRES', childcareR.entries.length, prevChildcare.length);
          gate('KINDERGARTENS', kindergartens.length, prevKindergartens.length);

          // HDB Property Information — block-level dwelling-unit counts by flat type.
          // Refreshed alongside amenities so we always know each block's real mix.
          const propRecs = await fetchDataset('d_17f5382f26140b1fdae0ba2ef6239d2f');
          const { byStreet: propertyInfo, counted: propertyCount } = buildPropertyInfo(propRecs);
          console.log(`PROPERTY_INFO: ${Object.keys(propertyInfo).length} streets, ${propertyCount} blocks with any sold flats`);
          gate('PROPERTY_INFO', propertyCount, prevPropertyCount);

          // Write
          html = inject(html, 'PRIMARY_SCHOOLS', buildConst('PRIMARY_SCHOOLS', schoolsR.entries));
          html = inject(html, 'CHILDCARE_CENTRES', buildConst('CHILDCARE_CENTRES', childcareR.entries));
          html = inject(html, 'KINDERGARTENS', buildConst('KINDERGARTENS', kindergartens));
          const propRegex = /const PROPERTY_INFO=\{[\s\S]*?\n\};/m;
          if (!propRegex.test(html)) throw new Error('Cannot find PROPERTY_INFO in index.html');
          html = html.replace(propRegex, buildPropertyInfoConst(propertyInfo));
          fs.writeFileSync('index.html', html);

          // One-glance monthly summary — the workflow commits to main unattended,
          // so this is the only witness that a skim needs.
          function summ(name, prev, r) {
            const reused = r.reusedByPostal + r.reusedByName;
            const parts = [];
            if (reused > 0) parts.push(`${reused} reused`);
            if (r.goneFromSource > 0) parts.push(`${r.goneFromSource} gone-from-source`);
            if (r.lost > 0) parts.push(`${r.lost} lost`);
            return `${name} ${prev}→${r.entries.length}` + (parts.length ? ` (${parts.join(', ')})` : '');
          }
          const kSumm = `KINDERGARTENS ${prevKindergartens.length}→${kindergartens.length} (${moeMKs.length} MOE MK)`;
          const pSumm = `PROPERTY_INFO ${prevPropertyCount}→${propertyCount} blocks (${Object.keys(propertyInfo).length} streets)`;
          console.log(`\n=== SUMMARY ===\n${summ('SCHOOLS', prevSchools.length, schoolsR)} | ${summ('CHILDCARE', prevChildcare.length, childcareR)} | ${kSumm} | ${pSumm}`);
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update school and childcare coordinates [$(date '+%Y-%m-%d')]"
          # This workflow runs ~10–15 min. Human edits or other workflows can land
          # on main in that window (that's how run #11 failed). Proactively rebase
          # onto the current main before pushing so we never depend on a stale ref.
          # If the rebase hits a conflict (someone edited the same constant lines
          # we just rewrote), fail LOUDLY without force-pushing — force-push here
          # would silently clobber the human edit.
          if ! git pull --rebase origin main; then
            echo "::error::Rebase conflict — a concurrent commit touched the amenity constants this workflow rewrites. Aborting without force-push. Resolve manually and re-trigger."
            git rebase --abort || true
            exit 1
          fi
          git push
