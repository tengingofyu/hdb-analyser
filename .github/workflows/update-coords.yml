name: Update Coordinates

on:
  schedule:
    - cron: '0 2 1 * *'  # 1st of every month at 2am UTC
  workflow_dispatch:       # manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --prefix .github/scripts node-fetch

      - name: Generate coordinates
        env:
          ONEMAP_EMAIL: ${{ secrets.ONEMAP_EMAIL }}
          ONEMAP_PASSWORD: ${{ secrets.ONEMAP_PASSWORD }}
          DATAGOV_API_KEY: ${{ secrets.DATAGOV_API_KEY }}
        run: node .github/scripts/generate-coords.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "chore: update school and childcare coordinates [$(date '+%Y-%m-%d')]"
          git push
